function analyzeStories(){const unique=new Map();for(const e of storyEntries()){const original=e.t.trim();const raw=Array.from(original).length===1?original:original.replace(/[。！？!?\s]+$/g,'');const norm=raw.normalize('NFKC').replace(/\s+/g,'').toLowerCase();if(!norm||/^(特に(?:は)?(?:ありません|ないです|ありませんでした)|ありません|ないです|とくになし|なし|特になし|特にない|わからない|分からない|普通|不明|[-ー]+)$/.test(norm))continue;let item=unique.get(norm);if(!item){item={text:raw,roles:[],topics:[],events:[]};unique.set(norm,item)}item.roles.push(e.i)}const entries=[...unique.values()];for(const e of entries){e.topics=topicRules.filter(x=>x.re.test(e.text));e.events=eventRules.filter(x=>x.re.test(e.text)&&!(x.not&&x.not.test(e.text))&&!/(?:したことはない|したわけではない|していない|できなかった)$/.test(e.text));}return entries;}

const ranks=Object.entries(total).sort((a,b)=>b[1]-a[1]);const pool=[];for(const [g,tags] of Object.entries(expanded)){const exact=entries.find(e=>e.text===g);const known=semanticWords[g]||{};const special=specialWords[g];const matches=entries.filter(e=>e.text.length>=2&&!/(?:できなかった|できなかったです|できない|していない|しなかった|しなかったです|したことはない|ではない|したい|したかった)$/.test(e.text)&&(kanjiData[g]?.e||[]).flatMap(x=>x.split(/[，、]/)).some(w=>w.length>=2&&w.length<=12&&w.includes(g)&&e.text.includes(w)&&!/^(不|無|非)/.test(w)));const matched=matches[0]&&(kanjiData[g]?.e||[]).flatMap(x=>x.split(/[，、]/)).filter(w=>w.length>=2&&w.includes(g)&&matches[0].text.includes(w)&&!/^(不|無|非)/.test(w)).sort((a,b)=>b.length-a.length)[0];if(!exact&&!special&&!Object.keys(known).length&&!matched)continue;if(special&&!boost[g]&&!exact&&!matched)continue;const keys=special?[special[0]]:Object.keys(known).length?Object.keys(known):tags;const k=keys.slice().sort((a,b)=>total[b]-total[a])[0]||ranks[0][0];const proof=[...new Set([...(sources[g]||[]),...matches])];const specific=(boost[g]||0)+(matched?3:0);const v=(proof.length?(total[k]||0)*0.7:(base[k]||0)*0.7)+specific*1.8+(exact?100:0)+(descriptions[g]?0.2:0);pool.push({g,k,v,word:special?.[1]||known[k]||matched||g,exact,matched,proof,specific});}pool.sort((a,b)=>b.v-a.v||b.specific-a.specific||a.g.localeCompare(b.g,'ja'));return {entries,choice,total,ranks,pool,themeSources};}

function makeReason(x,a){const glyph='「'+x.g+'」';const evidence=[...new Set(x.proof||[])].filter(e=>e.text!==x.g).sort((u,v)=>Math.min(...u.roles)-Math.min(...v.roles));const lines=[];if(evidence.length){lines.push(worksheetEvidence(evidence[0]));const second=evidence.find(e=>e!==evidence[0]&&!e.text.includes(evidence[0].text)&&!evidence[0].text.includes(e.text)&&Math.min(...e.roles)!==Math.min(...evidence[0].roles));if(second&&lines.join('').length+second.text.length<145)lines.push(worksheetEvidence(second));}else if(!x.exact){lines.push('今年を振り返ると、'+worksheetAngle[x.k]+'が印象に残っています。');}else{lines.push('今年の自分を表す文字として、'+glyph+'が思い浮かびました。');}
let angle=worksheetSpecific[x.g];if(x.g==='球'){if(evidence.some(e=>e.topics.some(t=>t.label==='野球')&&e.roles.includes(1)))angle='野球に打ち込んだ一年を、この文字で表したい';else if(evidence.some(e=>e.topics.some(t=>t.label==='野球')))angle='野球にまつわる思い出を、この文字に込めたい';else angle='球技にまつわる思い出を大切にしたい';}if(x.g==='勝'&&evidence.some(e=>/勝てな|負け|敗退/.test(e.text)))angle='勝てなかった経験も含めて、勝負に向き合った時間を忘れずにいたい';if(!angle){if(x.matched)angle='「'+x.matched+'」という言葉に表れた経験を忘れずにいたい';else if(x.word!==x.g)angle='「'+x.word+'」という意味合いを、今年の思い出に重ねたい';else if(x.exact)angle='この文字に自分なりの思いを込めたい';else angle=worksheetAngle[x.k]+'を大切にしたい';}
lines.push(angle+'と思い、今年の一字を'+glyph+'にしました。');return lines.join('');}
function finish(){clearInterval(timer);show('<div class="center" role="status" aria-live="polite"><small>一年漢字君の分析室</small><h2>今年の一字を考えているよ！</h2><img class="mascot-spin" alt="考え中の一年漢字君" src="'+mascotSrc+'"><p id="wait" class="analysis-status">回答を整理しています…</p><progress id="analysisProgress" max="4" value="0"></progress><p class="muted">自由記述と選択式の回答を照らし合わせます。</p></div>');let stage=0,analysis,entries;const labels=['同じ内容をまとめ、出来事や話題を整理しています…','文字の意味と回答のつながりを調べています…','候補の重複を整理し、理由を組み立てています…','結果をまとめています…'];function step(){try{if(stage===0)entries=analyzeStories();if(stage===1)analysis=analyzeYear(entries);if(stage===2){analysis.candidates=chooseCandidates(analysis);analysis.reason=makeReason(analysis.candidates[0],analysis);}document.getElementById('wait').textContent=labels[stage];document.getElementById('analysisProgress').value=stage+1;stage++;if(stage===4){setTimeout(()=>{try{revealYear(analysis)}catch(e){analysisError(e)}},reduced?0:300)}else setTimeout(step,reduced?0:450)}catch(e){analysisError(e)}}setTimeout(step,30)}
function analysisError(e){console.error(e);show('<h2>分析中に問題が起きました</h2><p>回答を残したまま、もう一度分析できます。</p><button class="primary" onclick="finish()">もう一度分析</button><button onclick="writeQuestion(4)">回答に戻る</button>')}
function revealYear(a){const candidates=a.candidates||chooseCandidates(a);const w=candidates[0];if(!w)throw Error('No candidate');const k=w.k,r=[a.ranks.find(z=>z[0]===k),...a.ranks.filter(z=>z[0]!==k)];const pos=[[170,130],[76,78],[267,90],[92,204],[260,194],[170,25]];const cloud='<svg viewBox="0 0 340 275" role="img" aria-label="候補文字の分布" style="width:100%;max-width:520px"><circle cx="170" cy="130" r="62" fill="#e4efe4"/><circle cx="170" cy="130" r="112" fill="none" stroke="#dce5df" stroke-dasharray="3 6"/>'+candidates.map((x,i)=>`<text x="${pos[i][0]}" y="${pos[i][1]}" text-anchor="middle" dominant-baseline="central" font-family="serif" font-size="${i===0?100:36}" fill="${['#306c58','#a66d48','#627fa5','#8b70a2','#917d38'][i%5]}">${esc(x.g)}</text>`).join('')+'</svg>';const details=candidates.slice(1).map(x=>'<div class="candidate-card"><div class="letter">'+esc(x.g)+'</div><div><b>'+esc(x.word)+'</b><p>'+esc(describeCandidate(x))+'</p>'+(x.proof.length?'<div class="proof">自由記述：'+esc(shortText(x.proof[0].text))+'</div>':(answers.find(z=>z[1]===x.k)?'<div class="proof">選んだ回答：'+esc(answers.find(z=>z[1]===x.k)[0])+'</div>':''))+'</div></div>').join('');const refs=a.entries.length?'<details class="answer-ref"><summary>分析に使った自由記述（参考）</summary>'+a.entries.map(e=>'<p>'+esc(shortText(e.text))+' <span class="muted">'+esc([...new Set([...e.topics,...e.events].map(t=>t.label))].join('・')||'具体的な言葉として保持')+'</span></p>').join('')+'</details>':'';show('<div class="center"><small>YOUR LETTER</small><h2>あなたの一年を表す文字たち</h2>'+cloud+'<h2>今年の一字「'+esc(w.g)+'」</h2><span class="tag">'+esc(w.word)+'</span></div><h2>今年の一字に選ばれた理由</h2><p class="muted">ワークシート用の文章例。自分の気持ちに合うように、文章を直接編集できます。</p><p id="reason" class="result-reason worksheet-edit" contenteditable="plaintext-only" role="textbox" aria-label="ワークシート用の振り返り文" aria-multiline="true" spellcheck="false">'+esc(a.reason||makeReason(w,a))+'</p><button onclick="copyReason()">振り返り文をコピーする</button>'+refs+bonus(w.g,k)+yearArt(k,r)+'<h2>回答から見えた一年の特徴</h2>'+r.slice(0,3).map(([key])=>'<p><b>'+meta[key][2]+'</b>：'+esc(answers.filter(z=>z[1]===key).map(z=>z[0]).slice(0,2).join('、')||'自由記述からの関連')+'</p>').join('')+'<h2>ほかの候補文字</h2>'+details+'<p class="muted">端末内のルールで話題・経験・文字の意味を照合しています。文章の意味を完全に理解する生成AIではありません。結果は振り返りのヒントです。</p><button class="primary" onclick="home()">もう一度遊ぶ</button>');}
